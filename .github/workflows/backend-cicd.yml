name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "GrowthOps.Api/**"
      - ".github/workflows/backend-cicd.yml"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore GrowthOps.Api/GrowthOps.Api.csproj

      - name: Build backend
        run: dotnet build GrowthOps.Api/GrowthOps.Api.csproj --configuration Release --no-restore

      - name: Publish backend
        run: dotnet publish GrowthOps.Api/GrowthOps.Api.csproj --configuration Release --no-build --output ./publish

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: growthops-api
          package: ./publish
