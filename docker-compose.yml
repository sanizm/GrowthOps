services:
  postgres:
    image: postgres:16
    container_name: growthops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: growthops
    ports:
      - "5432:5432"
    volumes:
      - growthops_pgdata:/var/lib/postgresql/data

volumes:
  growthops_pgdata:
